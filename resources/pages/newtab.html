<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>New Tab · Horizon</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf8f4;
    --fg: #1a1814;
    --muted: #5e5852;
    --subtle: #9a948b;
    --surface: #ffffff;
    --surface-hover: rgba(0,0,0,0.04);
    --border: rgba(20,15,10,0.06);
    --border-strong: rgba(20,15,10,0.14);
    --accent: #d44d7a;
    --accent-soft: rgba(212,77,122,0.10);
    --ai-accent: #c44a7e;
    --ai-tint: rgba(212,77,122,0.07);
    --shadow-card: 0 1px 2px rgba(20,15,10,0.04), 0 12px 32px rgba(20,15,10,0.06);
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', system-ui, sans-serif;
    --font-display: 'Instrument Serif', Georgia, serif;
    --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #08090c;
      --fg: #f3f3f5;
      --muted: #9a9ca8;
      --subtle: #5d5f6b;
      --surface: #13151b;
      --surface-hover: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.06);
      --border-strong: rgba(255,255,255,0.14);
      --accent: #e8a368;
      --accent-soft: rgba(232,163,104,0.14);
      --ai-accent: #e8a368;
      --ai-tint: rgba(232,163,104,0.08);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: var(--font); background: var(--bg); color: var(--fg);
    -webkit-font-smoothing: antialiased; letter-spacing: -0.005em; }
  body { padding: 6% 8% 5%; display: flex; flex-direction: column; gap: 28px; overflow-y: auto; }

  .greeting {
    font-family: var(--font-display); font-weight: 400;
    font-size: clamp(28px, 4vw, 46px);
    letter-spacing: -0.015em; line-height: 1.05;
    margin: 0;
  }
  .greeting .accent { color: var(--accent); font-style: italic; }
  .subline { color: var(--muted); font-size: 14px; margin-top: -18px; }

  .omni {
    width: 100%; max-width: 760px;
    background: var(--surface); border: none; border-radius: 18px;
    padding: 18px 22px; display: flex; align-items: center; gap: 14px;
    box-shadow: var(--shadow-card), 0 0 0 0.5px var(--border);
    cursor: text;
    transition: box-shadow 180ms cubic-bezier(0.4,0,0.2,1), border-color 180ms;
  }
  .omni:hover { box-shadow: 0 1px 2px rgba(20,15,10,0.04), 0 16px 40px rgba(212,77,122,0.14), 0 0 0 0.5px var(--accent); }
  .omni svg { color: var(--ai-accent); flex-shrink: 0; }
  .omni .placeholder { flex: 1; font-size: 15px; color: var(--subtle); font-style: italic; letter-spacing: -0.01em; }
  .omni input { flex: 1; border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 15px;
    color: var(--fg); letter-spacing: -0.01em; }
  .omni .kbd {
    padding: 4px 8px; border-radius: 7px; background: var(--surface-hover);
    font-family: var(--font-mono); font-size: 11px; color: var(--muted);
    border: 0.5px solid var(--border);
  }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: -12px; }
  .chip {
    padding: 6px 11px; border-radius: 999px;
    background: rgba(255,255,255,0.6); border: 0.5px solid var(--border);
    font-size: 12px; font-weight: 500; color: var(--muted);
    display: inline-flex; gap: 6px; align-items: center;
    cursor: pointer;
    transition: background 120ms, color 120ms, border-color 120ms;
  }
  @media (prefers-color-scheme: dark) {
    .chip { background: var(--surface); color: var(--muted); }
  }
  .chip:hover { background: var(--surface); color: var(--fg); border-color: var(--border-strong); }
  .chip.accent {
    background: linear-gradient(135deg, var(--ai-tint), var(--accent-soft));
    color: var(--ai-accent);
    border-color: rgba(212,77,122,0.24);
  }
  .chip svg { width: 12px; height: 12px; }

  .grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 24px; margin-top: 8px; }
  @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }

  .section-head {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding: 0 4px;
    font-size: 11.5px; font-weight: 700; color: var(--subtle);
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .section-head .sub { font-weight: 500; text-transform: none; letter-spacing: 0; }
  .section-head svg { width: 13px; height: 13px; }

  .cards-recent { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .card {
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: 14px;
    padding: 10px; display: flex; align-items: center; gap: 10px;
    color: var(--fg); text-decoration: none; cursor: pointer;
    transition: box-shadow 120ms, transform 120ms;
  }
  .card:hover { box-shadow: var(--shadow-card); transform: translateY(-1px); }
  .card .icon {
    width: 22px; height: 22px; border-radius: 7px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #fff;
  }
  .card .meta { min-width: 0; flex: 1; }
  .card .meta .t { font-size: 12.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .meta .sub { font-size: 11px; color: var(--subtle); }

  .threads { display: flex; flex-direction: column; gap: 8px; }
  .thread {
    background: var(--surface); border: 0.5px solid var(--border);
    border-radius: 14px; padding: 12px;
  }
  .thread .head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 13px; font-weight: 600; }
  .thread .dot { width: 6px; height: 6px; border-radius: 50%; }
  .thread .meta { font-size: 11.5px; color: var(--muted); }
</style>
</head>
<body>
  <h1 class="greeting" id="greeting">Good afternoon, <span class="accent" id="who">there</span></h1>
  <div class="subline" id="subline"></div>

  <form id="search-form" autocomplete="off" style="margin: 0;">
    <label class="omni">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3l1.8 4.4L18.2 9.2 13.8 11 12 15.4 10.2 11 5.8 9.2 10.2 7.4z" />
      </svg>
      <input id="q" type="text" placeholder="Ask Horizon, or paste a URL…" autofocus spellcheck="false" />
      <span class="kbd">⌘K</span>
    </label>
  </form>

  <div class="chips">
    <span class="chip accent">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 4.4L18.2 9.2 13.8 11 12 15.4 10.2 11 5.8 9.2 10.2 7.4z" /></svg>
      Pick up where I left off
    </span>
    <span class="chip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="8" height="14" rx="1.5" /><rect x="13" y="5" width="8" height="14" rx="1.5" /></svg>
      Compare my open tabs
    </span>
    <span class="chip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21v-1a8 8 0 0 1 16 0v1" /></svg>
      Run an agent
    </span>
    <span class="chip">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></svg>
      Summarize today's reading
    </span>
  </div>

  <div class="grid">
    <div>
      <div class="section-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" /><polyline points="12 6 12 12 16 14" /></svg>
        Recently visited
      </div>
      <div class="cards-recent" id="recent"></div>
    </div>
    <div>
      <div class="section-head">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2" /><polyline points="2 17 12 22 22 17" /><polyline points="2 12 12 17 22 12" /></svg>
        Research threads<span class="sub">· AI-grouped tabs</span>
      </div>
      <div class="threads" id="threads"></div>
    </div>
  </div>

  <script>
    (function () {
      var hour = new Date().getHours();
      var greet = hour < 5 ? 'Good night' : hour < 12 ? 'Good morning' : hour < 18 ? 'Good afternoon' : 'Good evening';
      document.getElementById('greeting').firstChild.textContent = greet + ', ';

      var weekday = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'][new Date().getDay()];
      document.getElementById('subline').textContent = weekday + ' · Welcome back to Horizon';

      var COLORS = ['#d44d7a','#c44a7e','#7a3b1e','#2f6fb8','#3a7a4e','#5e6ad2','#cc785c'];
      var RECENT = [
        { t: 'DuckDuckGo', sub: 'duckduckgo.com', url: 'https://duckduckgo.com', i: 'D' },
        { t: 'GitHub', sub: 'github.com', url: 'https://github.com', i: 'G' },
        { t: 'Wikipedia', sub: 'wikipedia.org', url: 'https://wikipedia.org', i: 'W' },
        { t: 'Hacker News', sub: 'news.ycombinator.com', url: 'https://news.ycombinator.com', i: 'H' },
        { t: 'YouTube', sub: 'youtube.com', url: 'https://youtube.com', i: 'Y' },
        { t: 'arXiv', sub: 'arxiv.org', url: 'https://arxiv.org', i: 'A' }
      ];
      var recent = document.getElementById('recent');
      RECENT.forEach(function (r, idx) {
        var a = document.createElement('a');
        a.className = 'card'; a.href = r.url;
        var ic = document.createElement('div');
        ic.className = 'icon'; ic.style.background = COLORS[idx % COLORS.length];
        ic.textContent = r.i;
        var meta = document.createElement('div'); meta.className = 'meta';
        var t = document.createElement('div'); t.className = 't'; t.textContent = r.t;
        var s = document.createElement('div'); s.className = 'sub'; s.textContent = r.sub;
        meta.appendChild(t); meta.appendChild(s);
        a.appendChild(ic); a.appendChild(meta);
        recent.appendChild(a);
      });

      var THREADS = [
        { title: 'Tabs to revisit', tabs: 4, when: 'Today', c: '#d44d7a' },
        { title: 'Open work threads', tabs: 7, when: 'This week', c: '#2f6fb8' },
        { title: 'Reading list', tabs: 3, when: 'Saved', c: '#3a7a4e' }
      ];
      var threads = document.getElementById('threads');
      THREADS.forEach(function (th) {
        var w = document.createElement('div'); w.className = 'thread';
        var head = document.createElement('div'); head.className = 'head';
        var dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = th.c;
        var tt = document.createElement('span'); tt.textContent = th.title;
        head.appendChild(dot); head.appendChild(tt);
        var m = document.createElement('div'); m.className = 'meta';
        m.textContent = th.tabs + ' tabs · ' + th.when;
        w.appendChild(head); w.appendChild(m);
        threads.appendChild(w);
      });

      document.getElementById('search-form').addEventListener('submit', function (e) {
        e.preventDefault();
        var q = document.getElementById('q').value.trim();
        if (!q) return;
        var isUrl = /^https?:\/\//i.test(q) || /^[\w-]+(\.[\w-]+)+/.test(q);
        window.location.href = isUrl
          ? (q.indexOf('http') === 0 ? q : 'https://' + q)
          : 'https://duckduckgo.com/?q=' + encodeURIComponent(q);
      });
    })();
  </script>
</body>
</html>
