<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Page error</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ebeef3;
        --fg: #1f2128;
        --muted: #5f6470;
        --accent: #5e6aff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15171c;
          --fg: #e6e8ee;
          --muted: #9aa0ac;
        }
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font-family:
          -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto,
          sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .badge {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: rgba(94, 106, 255, 0.14);
        color: var(--accent);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
        letter-spacing: -0.01em;
      }
      p {
        margin: 4px 0;
        color: var(--muted);
        font-size: 14px;
        max-width: 480px;
      }
      .code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <div class="badge" aria-hidden="true">
      <svg
        width="32"
        height="32"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="10" />
        <line x1="12" y1="8" x2="12" y2="12" />
        <line x1="12" y1="16" x2="12.01" y2="16" />
      </svg>
    </div>
    <h1 id="title">This page can&rsquo;t be reached</h1>
    <p id="url"></p>
    <p class="code" id="code"></p>
    <script>
      var params = new URL(window.location.href).searchParams;
      var code = params.get("code");
      var url = params.get("url");
      if (window.location.pathname.indexOf("/crashed") === 0) {
        document.getElementById("title").textContent = "This page crashed";
      }
      if (url)
        document.getElementById("url").textContent = decodeURIComponent(url);
      if (code)
        document.getElementById("code").textContent = "Error code: " + code;
    </script>
  </body>
</html>
