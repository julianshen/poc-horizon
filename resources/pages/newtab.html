<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>New Tab</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ebeef3;
        --fg: #1f2128;
        --fg-muted: #5f6470;
        --surface: #ffffff;
        --border: rgba(15, 17, 21, 0.08);
        --ring: rgba(94, 106, 255, 0.35);
        --accent: linear-gradient(135deg, #5e6aff 0%, #8b5cf6 100%);
        --shadow-md: 0 4px 12px rgba(15, 17, 21, 0.08);
        --shadow-lg: 0 12px 32px rgba(15, 17, 21, 0.14);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #15171c;
          --fg: #e6e8ee;
          --fg-muted: #9aa0ac;
          --surface: #1c1f26;
          --border: rgba(255, 255, 255, 0.08);
        }
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
        background: var(--bg);
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        background:
          radial-gradient(ellipse 80% 60% at 20% 0%, rgba(94, 106, 255, 0.18), transparent 70%),
          radial-gradient(ellipse 80% 60% at 80% 100%, rgba(139, 92, 246, 0.18), transparent 70%),
          var(--bg);
      }
      .brand { display: flex; align-items: center; gap: 14px; margin-bottom: 36px; }
      .logo {
        width: 56px; height: 56px;
        border-radius: 18px;
        background: var(--accent);
        box-shadow: var(--shadow-lg);
        position: relative;
      }
      .logo::after {
        content: '';
        position: absolute; inset: 22% 22% auto auto;
        width: 22%; height: 22%;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.5);
        filter: blur(4px);
      }
      .wordmark {
        font-size: 40px; font-weight: 700; letter-spacing: -0.02em;
        background: var(--accent);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      form { width: min(560px, 90vw); }
      .search {
        display: flex; align-items: center; gap: 10px;
        height: 52px; padding: 0 18px;
        background: var(--surface);
        border-radius: 999px;
        box-shadow: var(--shadow-md), inset 0 0 0 1px var(--border);
        transition: box-shadow 200ms cubic-bezier(0.4,0,0.2,1);
      }
      .search:focus-within { box-shadow: var(--shadow-lg), 0 0 0 4px var(--ring); }
      .search svg { width: 18px; height: 18px; color: var(--fg-muted); flex-shrink: 0; }
      .search input {
        flex: 1; height: 100%;
        border: 0; outline: 0; background: transparent;
        color: var(--fg); font-size: 15px; font-family: inherit;
      }
      .shortcuts {
        margin-top: 40px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
        gap: 12px;
        width: min(560px, 90vw);
      }
      .shortcut {
        display: flex; flex-direction: column; align-items: center; gap: 8px;
        padding: 14px 8px;
        background: var(--surface);
        border-radius: 14px;
        box-shadow: inset 0 0 0 1px var(--border);
        text-decoration: none;
        color: var(--fg); font-size: 12px; font-weight: 500;
        cursor: pointer;
        transition: transform 120ms, box-shadow 120ms;
      }
      .shortcut:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-md), inset 0 0 0 1px var(--border);
      }
      .shortcut .icon {
        width: 32px; height: 32px; border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
        font-size: 14px; font-weight: 700; color: white;
      }
      footer {
        position: fixed; bottom: 18px;
        color: var(--fg-muted);
        font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <div class="logo" aria-hidden="true"></div>
      <div class="wordmark">Horizon</div>
    </div>
    <form id="search-form" autocomplete="off">
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
        <input id="q" type="text" placeholder="Search the web or enter a URL" autofocus spellcheck="false" />
      </label>
    </form>
    <div class="shortcuts" id="shortcuts"></div>
    <footer>Horizon &middot; New Tab</footer>
    <script>
      (function () {
        var SHORTCUTS = [
          { name: 'DuckDuckGo', url: 'https://duckduckgo.com', color: '#de5833', letter: 'D' },
          { name: 'GitHub', url: 'https://github.com', color: '#24292e', letter: 'G' },
          { name: 'Wikipedia', url: 'https://wikipedia.org', color: '#000', letter: 'W' },
          { name: 'YouTube', url: 'https://youtube.com', color: '#ff0000', letter: 'Y' },
          { name: 'Hacker News', url: 'https://news.ycombinator.com', color: '#ff6600', letter: 'H' }
        ];
        var root = document.getElementById('shortcuts');
        SHORTCUTS.forEach(function (s) {
          var a = document.createElement('a');
          a.className = 'shortcut';
          a.href = s.url;
          var icon = document.createElement('div');
          icon.className = 'icon';
          icon.style.background = s.color;
          icon.textContent = s.letter;
          var label = document.createElement('span');
          label.textContent = s.name;
          a.appendChild(icon);
          a.appendChild(label);
          root.appendChild(a);
        });
        document.getElementById('search-form').addEventListener('submit', function (e) {
          e.preventDefault();
          var q = document.getElementById('q').value.trim();
          if (!q) return;
          var isUrl = /^https?:\/\//i.test(q) || /^[\w-]+(\.[\w-]+)+/.test(q);
          window.location.href = isUrl
            ? (q.indexOf('http') === 0 ? q : 'https://' + q)
            : 'https://duckduckgo.com/?q=' + encodeURIComponent(q);
        });
      })();
    </script>
  </body>
</html>
